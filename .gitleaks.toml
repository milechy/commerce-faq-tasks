title = "RAJIUCE gitleaks configuration"
# Allowlist policy and rationale: docs/GITLEAKS_ALLOWLIST_POLICY.md

# ---------------------------------------------------------------------------
# 標準ルールセットを有効化 (Phase6)
# ---------------------------------------------------------------------------
# gitleaks 同梱の標準ルール (AWS キー / GitHub PAT / Slack トークン / 汎用高エントロピー
# API キー 等) を有効化する。これまで本 config は useDefault を入れておらず、標準
# シークレット検知が実質 no-op で、必須チェック "gitleaks" は DB 接続文字列ルール
# 1 件しか見ていなかった。標準ルール有効化に伴う既存履歴の検知は、下記
# [allowlist] / .gitleaksignore で 1 件ずつトリアージ済み。
#   → トリアージ内訳と本物資格情報のローテ要リスト: docs/GITLEAKS_ALLOWLIST_POLICY.md
[extend]
useDefault = true

# 本 config は上記 [extend] useDefault=true で gitleaks 標準ルールを有効化した上で、
# 下記カスタムルール (DB 接続文字列パスワード) を追加する。
# 標準ルール有効化に伴い全履歴に現れた既存検知 (計 29 件) は 1 件ずつトリアージ済みで、
#   - 難読化 min.js / 公開 LP・デモ埋め込みキー / テスト fixture → 下の [allowlist] paths
#   - 公開キー・識別子・docs プレースホルダ (deploy jwt=Supabase anon / CF beacon token /
#     org UUID / docs 例) → .gitleaksignore に fingerprint 登録
# のいずれかで抑止している。実在の生きた資格情報は 0 件だった (DB パスワードのみ #1100 で
# 既知・ローテ要としてトラック済み)。内訳は docs/GITLEAKS_ALLOWLIST_POLICY.md を参照。

# ---------------------------------------------------------------------------
# カスタムルール: DB/メッセージング接続文字列にインラインで書かれたパスワード
# ---------------------------------------------------------------------------
# 背景: 本番 Postgres の実パスワード (20桁) が
#   postgresql://postgres:<実PW>@127.0.0.1:5432/commerce_faq
# の形で git 履歴に残存していたが、標準ルールは接続文字列内パスワードを拾わず
# CI をすり抜けた。同種の漏洩を今後 CI で検知する。
#
# 判定方針:
#   - proto://user:PASSWORD@host 形式の PASSWORD を secretGroup として抽出
#   - 実漏洩はホストが 127.0.0.1 (VPS 上で localhost バインドの Postgres) だったため、
#     ホストでは除外できない。除外は「パスワードがプレースホルダか / 低エントロピーか」で行う。
#   - entropy 閾値 (3.2) で pass / postgres / CHANGE_ME / XXXXX 等の明示ダミーを自動除外し、
#     <...> / ${...} / your_password 等はエントロピーが高くても allowlist で明示除外する。
[[rules]]
id = "db-connection-string-password"
description = "DB/broker connection string with inline password (postgres/mysql/mongodb/redis/amqp)"
# 非キャプチャの proto 群 + user + キャプチャ1=パスワード(5文字以上) + @host
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|rediss?|amqps?)://[^:@/\s]{1,64}:([^@/\s]{5,})@[^\s"'` )\]}>]+'''
secretGroup = 1
entropy = 3.2
keywords = [
  "postgres",
  "postgresql",
  "mysql",
  "mongodb",
  "redis",
  "amqp",
]

  # このルール専用の allowlist。判定対象はキャプチャした secret (=パスワード)。
  [rules.allowlist]
  description = "接続文字列パスワードのプレースホルダ/明示ダミー (実資格情報ではない)"
  regexTarget = "secret"
  regexes = [
    # <DB_PASSWORD>, <password>, <...> の山括弧プレースホルダ
    '''^<[^>]*>$''',
    # ${DB_PASSWORD}, ${...} のシェル/env 展開プレースホルダ
    '''^\$\{[^}]*\}$''',
    # 明示的なダミー語 (完全一致)。エントロピーが 3.2 を超えても除外する。
    '''(?i)^(pass|password|passwd|postgres|postgresql|mysql|mongo|root|admin|user|guest|changeme|change[_-]?me|change_this|secret|example|examplepass|test|tests|testing|testpass|dummy|placeholder|redacted|sample|foobar|foo|bar|baz|xxx+|yyy+|zzz+|your[_-].*|my[_-].*|some[_-].*|\.\.\.)$''',
    # CHANGE_ME / CHANGEME を含む定番の要書換マーカー (部分一致)
    '''(?i)change[_-]?me''',
    '''(?i)your[_-]?password''',
    '''(?i)replace[_-]?me''',
  ]

# ---------------------------------------------------------------------------
# 既知の誤検知 allowlist (グローバル)
# ---------------------------------------------------------------------------
[allowlist]
description = "Known false positives — see docs/GITLEAKS_ALLOWLIST_POLICY.md for each entry's rationale"
regexTarget = "secret"

paths = [
  # Demo widget embed pages: the api-key in data-api-key attribute is intentional.
  # This is the carnation demo tenant key embedded for live widget demo pages.
  # The key grants access only to the sandboxed demo tenant — not a real credential leak.
  '''public/carnation-demo/''',
  # Sibling single-file demo page (not under the dir above). Same demo-tenant embed key.
  '''public/carnation-demo\.html''',

  # Public landing / demo pages (Phase6 useDefault triage).
  # The data-api-key values shown in these marketing/demo pages are widget *embed* keys,
  # which are public by design (they ship in client-side HTML to every site visitor and
  # only grant sandboxed demo-tenant access). No server-side secret belongs in this dir.
  '''public/lp/''',

  # Distributed widget bundle: minified/obfuscated build artifact. The generic-api-key
  # rule matches base64/obfuscated string chunks that change every build; these are not
  # committed credentials. Scoped to this single file, not all *.min.js.
  '''public/widget\.min\.js''',

  # Test fixture files: strings are synthetic, clearly marked as test data.
  # e.g. "my-secret-api-key-12345", "test-raw-api-key-abc123", "test-key-abc123"
  # These do not correspond to any real credential in the system.
  '''tests/phase48/apiKeyAuth\.test\.ts''',
  '''tests/widget/trackConversion\.test\.ts''',
  # Additional synthetic-fixture files surfaced by useDefault (Phase6 triage). The rjc_/r2c_
  # values here are mocked API-key responses / embed-code assertions, not real credentials.
  # Listed per-file (not a blanket tests/ path) so real secrets elsewhere stay in scope.
  '''tests/widget/recordAbExposure\.test\.ts''',
  '''tests/e2e/helpers/superAdminHarness\.ts''',
  '''admin-ui/src/pages/admin/tenants/EmbedCodeTab\.test\.tsx''',
  '''src/api/admin/tenants/routes\.test\.ts''',
]

regexes = [
  # Asana Project/Task GIDs — 16-digit sequential numeric identifiers.
  # The built-in rule "asana-client-id" triggers on these because the pattern
  # overlaps with Asana's OAuth client ID format, but in this codebase they are
  # only used as public task/project references (not OAuth credentials).
  # Seen in: docs/, PHASE_ROADMAP.md, .claude/skills/, SCRIPTS/r2c-asana-poll.sh,
  #          SCRIPTS/r2c-morning-report.sh
  # Entropy check: ~3.3 bits/char (numeric only) — below credential threshold.
  '''^121[0-9]{13}$''',
]
