name: E2E + Visual Regression (Gate 4b / Phase C)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'admin-ui/src/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'

# E2E は playwright.config.ts の baseURL(https://admin.r2c.biz)経由で本番環境を直接叩く
# (専用のstaging環境やサーバ起動ステップが無いため)。並行PRが同時にE2Eを走らせると
# 本番へのリクエストがレート制限(429)に達し、PRの内容と無関係にCIが赤くなる事象が
# 確認された(GID 1216947610263309)。E2Eジョブを1本ずつ直列実行させることで回避する。
# cancel-in-progress は必ず false — 後から来たPRのE2Eが先行PRの実行中E2Eをキャンセルして
# しまうと、先行PRの結果が失われるため。
concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E — Playwright (authenticated)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      # Phase A: Supabase 認証 → storageState 生成
      # 秘匿情報未設定の場合は空の storageState を生成してテストを graceful skip
      - name: Auth setup
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          E2E_ENABLED: '1'
        run: npx playwright test --project=setup

      # Phase A-2: super_admin 用 storageState 生成
      # qa-irregular-3roles.spec.ts の Role C(super_admin 越境/プレビュー)群が依存する。
      # TEST_SUPERADMIN_* 未設定の場合は superadmin.setup.ts が空スケルトンを書き、
      # Role C は spec 側の saReady チェックで graceful skip される(CIは赤化しない)。
      - name: Super admin auth setup
        env:
          TEST_SUPERADMIN_EMAIL: ${{ secrets.TEST_SUPERADMIN_EMAIL }}
          TEST_SUPERADMIN_PASSWORD: ${{ secrets.TEST_SUPERADMIN_PASSWORD }}
          E2E_ENABLED: '1'
        run: npx playwright test --project=superadmin-setup

      # E2E テスト (admin-ui project + public project)
      - name: Run E2E tests
        env:
          E2E_ENABLED: '1'
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_SUPERADMIN_EMAIL: ${{ secrets.TEST_SUPERADMIN_EMAIL }}
          TEST_SUPERADMIN_PASSWORD: ${{ secrets.TEST_SUPERADMIN_PASSWORD }}
        run: npx playwright test --project=admin-ui --project=chromium

      # Phase C: ビジュアルリグレッション（linux baseline が存在する場合のみ）
      - name: Visual regression (skip if no baseline)
        env:
          E2E_ENABLED: '1'
        run: |
          SNAPSHOT_DIR="tests/e2e/visual-regression.spec.ts-snapshots"
          if ls "${SNAPSHOT_DIR}"/*-linux.png 2>/dev/null | grep -q .; then
            echo "▶ linux baseline 存在 → visual regression 実行"
            npx playwright test --project=visual-regression
          else
            echo "⏭ linux baseline 未作成 → visual regression スキップ"
            echo "  初回作成: npx playwright test --project=visual-regression --update-snapshots"
            echo "  生成された *-linux.png をコミットしてください"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
