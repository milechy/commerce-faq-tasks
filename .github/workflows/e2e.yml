name: E2E + Visual Regression (Gate 4b / Phase C)

on:
  # main に対して手動実行できるようにしておく。2026-08-29 の障害調査では
  # 「main単体でも落ちるのか」を確かめるためだけに計測用PR(#1045)を立てる羽目になった。
  workflow_dispatch:

  # 本番監視としての定期実行。デプロイを伴わない本番の変化(テストテナントのデータ、
  # 外部依存、証明書の期限切れ等)は、これでしか気付けない。
  # 3時間ごと = 1日8回。PRトリガーを絞った分より少なく、実行回数は純減する
  # (2026-08-29 は1日で15回走っていた)。頻度を変えるならここ。
  schedule:
    - cron: '0 */3 * * *'

  # ⚠️ paths から src/** / admin-ui/src/** / public/** を意図的に外している。
  # E2E の向き先は本番なので、それらを変更したPRでE2Eを走らせても検証されるのは
  # 「本番の現在の状態」であって、そのPRの変更ではない。緑でも赤でも、PRの内容とは
  # 無関係な結果しか返らない。実際に検証できるのは、そのPRが変更した spec 自身だけ。
  # よってトリガーは spec と config の変更時に限る(壊れた spec をマージ前に弾く目的)。
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'playwright.config.ts'

# ⚠️ このワークフローが検証しているのは「本番の現在の状態」であって、PRの製品コードではない。
# E2E は tests/e2e/config.ts の ADMIN_BASE_URL/API_BASE_URL(既定値は本番)経由で
# 本番環境を直接叩き、CIにサーバ起動ステップが無い。つまりPRが変更した src/** や
# public/** は1行も読まれず、実際に検証されるのはそのPRが変更した tests/e2e/** だけ。
#
# 実例(2026-08-29): widget.js を壊した PR #1039 自身のE2Eは success で通った(11:44)。
# 壊れた本番がデプロイされた後(12:16)、無関係な全ブランチのE2Eが一斉に赤くなった。
# 守るべきPRを通し、無関係なPRを罰する向きに働いた。
#
# そこで役割を3層に分けた(Asana GID 1217969312827120):
#   左  … 配布物の静的検査 = `pnpm lint:widget` (Gate 1、マージ前に止まる)
#   中  … デプロイ直後の実挙動 = SCRIPTS/post-deploy-widget-smoke.sh (deploy-vps.sh が実行)
#   右  … 本番の継続監視 = このワークフローの schedule 実行
# PRトリガーはこの3層のどれでもなく、他人のPRを巻き込む害だけが残っていたため、
# spec 自身の変更時のみに絞った。
#
# 直列化の理由: 並行PRが同時にE2Eを走らせると
# 本番へのリクエストがレート制限(429)に達し、PRの内容と無関係にCIが赤くなる事象が
# 確認された(GID 1216947610263309)。E2Eジョブを1本ずつ直列実行させることで回避する。
# cancel-in-progress は必ず false — 後から来たPRのE2Eが先行PRの実行中E2Eをキャンセルして
# しまうと、先行PRの結果が失われるため。
concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E — Playwright (authenticated)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      # Phase A: Supabase 認証 → storageState 生成
      # 秘匿情報未設定の場合は空の storageState を生成してテストを graceful skip
      - name: Auth setup
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          E2E_ENABLED: '1'
        run: npx playwright test --project=setup

      # Phase A-2: super_admin 用 storageState 生成
      # qa-irregular-3roles.spec.ts の Role C(super_admin 越境/プレビュー)群が依存する。
      # TEST_SUPERADMIN_* 未設定の場合は superadmin.setup.ts が空スケルトンを書き、
      # Role C は spec 側の saReady チェックで graceful skip される(CIは赤化しない)。
      - name: Super admin auth setup
        env:
          TEST_SUPERADMIN_EMAIL: ${{ secrets.TEST_SUPERADMIN_EMAIL }}
          TEST_SUPERADMIN_PASSWORD: ${{ secrets.TEST_SUPERADMIN_PASSWORD }}
          E2E_ENABLED: '1'
        run: npx playwright test --project=superadmin-setup

      # E2E テスト (admin-ui project + public project)
      - name: Run E2E tests
        env:
          E2E_ENABLED: '1'
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_SUPERADMIN_EMAIL: ${{ secrets.TEST_SUPERADMIN_EMAIL }}
          TEST_SUPERADMIN_PASSWORD: ${{ secrets.TEST_SUPERADMIN_PASSWORD }}
        run: npx playwright test --project=admin-ui --project=chromium

      # Phase C: ビジュアルリグレッション（linux baseline が存在する場合のみ）
      - name: Visual regression (skip if no baseline)
        env:
          E2E_ENABLED: '1'
        run: |
          SNAPSHOT_DIR="tests/e2e/visual-regression.spec.ts-snapshots"
          if ls "${SNAPSHOT_DIR}"/*-linux.png 2>/dev/null | grep -q .; then
            echo "▶ linux baseline 存在 → visual regression 実行"
            npx playwright test --project=visual-regression
          else
            echo "⏭ linux baseline 未作成 → visual regression スキップ"
            echo "  初回作成: npx playwright test --project=visual-regression --update-snapshots"
            echo "  生成された *-linux.png をコミットしてください"
          fi

      # 定期実行・手動実行の失敗は誰の画面にも出ないため Slack へ流す。
      # pull_request の失敗は当該PRのチェック欄に出るので通知しない(二重通知を避ける)。
      # Gate 8 (gate-8-post-merge.yml) と同じ webhook・同じ形式。
      - name: Slack alert on failure (schedule / manual only)
        if: failure() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_R2C }}
        run: |
          MSG="⛔ *E2E FAIL* (本番監視 / ${{ github.event_name }})\n本番が壊れている可能性があります。デプロイ直後なら rollback を検討してください。\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ -n "${SLACK_WEBHOOK_URL:-}" ]]; then
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"${MSG}\"}" || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # 失敗の一次証拠(スクリーンショット・トレース・error-context)を残す。
      # playwright.config.ts は screenshot:'only-on-failure' / trace:'on-first-retry' を
      # 設定済みで、これらは outputDir 既定の test-results/ に出力される。
      # 上の playwright-report/ は reporter に html を設定していない限り生成されないため、
      # これまで失敗時に手掛かりが1つも残っていなかった(2026-08-29、E2E 2件の失敗を
      # 追った際にスクリーンショットが1枚も無く原因特定に至らなかった)。
      - name: Upload E2E failure artifacts (screenshots / traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
