name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # 毎週月曜9時
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      # 分類ロジックの自己検査(偽 pnpm を PATH に差し込むだけでネットワーク不要)。
      # audit-check.sh の判別が壊れたら、本番の audit が動く前にここで落とす。
      - run: bash SCRIPTS/audit-check.test.sh
      - run: bash SCRIPTS/security-scan.sh
      # security-scan.sh とは独立に、依存監査だけをもう一度ゲートにする。
      # ★生の `pnpm audit` を直に呼ばない★ — レジストリ不通でも非ゼロになるため、
      # それを脆弱性として扱うと無関係な PR が止まり、FAIL の意味も薄まる
      # (Asana 1218165546985984)。分類は audit-check.sh に一本化する。
      - run: bash SCRIPTS/audit-check.sh
