name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Gate 1 — typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # jest --runInBand が大規模スイートで node 既定ヒープ(~4GB)を超え OOM (FATAL heap limit / exit 134) するため明示拡張。
    # 症状: docs-only PR でも同一の OOM で Gate 1 が落ちる = main 由来の CI 環境問題 (PR 内容と無関係)。
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # public/widget.js は pnpm lint の対象(src / admin-ui/src)に入っておらず、
      # 未定義変数の参照が誰にも止められないまま本番へ出る。#1039 で
      # `var _abExposureSent = false;` の宣言だけが差し替えで失われ、
      # 本番のチャットが全テナントで送信不能になった(E2Eだけが検知していた)。
      - name: Lint widget.js (no-undef)
        run: pnpm lint:widget

      - name: Test
        run: pnpm test

      # SCRIPTS/ の shell テストは jest の testMatch({src,tests}/**/*.test.ts)に入らないため
      # 明示的に走らせる。配線しないと、admin-ui の vitest が #662 以降ずっと赤いまま
      # 誰にも気づかれなかったのと同じ穴になる(CLAUDE.md「テストの最低ライン」)。
      # backup-postgres.test.sh は本物のDB・Slackに触れない(PG_DUMP と NOTIFY を差し替える)。
      - name: Test shell scripts
        run: bash SCRIPTS/backup-postgres.test.sh

  billing-sql:
    name: Gate 4 — billing SQL integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 課金集計SQL(computeExpectedBilling)を、正規表現照合や再現実装ではなく
    # 実際にPostgresへ実行して検証する(A-2)。stripeSync.test.ts は集計SQLの
    # 意味論(GROUP BY・NUMERIC の丸め・タイムゾーン境界)を一度も実行しないまま
    # 守っていたため、他のGateとは別ジョブとして独立させた
    # (Gate 1 と並列実行できるようにし、失敗時にどちらが原因か切り分けやすくする)。
    services:
      postgres:
        # 素の postgres:16 には pgvector 拡張が入っておらず、サービスコンテナには
        # 起動後に exec で apt install する経路が無い(ジョブのステップからは
        # コンテナ内へ入れない)。書籍チャンク編集の楽観ロックSQL統合テスト
        # (bookChunkOptimisticLockSqlIntegration.test.ts)が faq_embeddings.embedding
        # (VECTOR(1536))へ実際に INSERT するため、pgvector 拡張が最初から入っている
        # 公式イメージに切り替える。Postgres 16 自体の互換性は変わらない。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BILLING_SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_sql_test
      # hermes-mcp のSQL越境防止テストも同じ使い捨てPostgres・同じDBを使い回す
      # (billingとhermes-mcpのテーブル群はFKで繋がっておらず、各テストファイルの
      # beforeEachが自分の使うテーブルだけTRUNCATEするため、専用サービスを
      # 新設せずジョブ全体のコストを増やさない)。
      HERMES_MCP_SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_sql_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ubuntu-latest ランナーに postgresql-client が入っている保証が無いため明示的に導入する。
      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client

      # 課金集計SQLが参照するテーブル(tenants / usage_logs / stripe_subscriptions /
      # stripe_usage_reports)だけを、実際のmigrationファイルを本番へ適用された
      # 順序どおりに流して作る。スコープを絞っている理由は
      # SCRIPTS/ci-billing-schema.sh のコメント参照(全74本超のmigrationを
      # 機械的に適用する仕組みはこのリポジトリに無く、依存順序が
      # ファイル名のアルファベット順とは一致しない箇所があるため)。
      - name: Apply billing schema migrations
        env:
          DATABASE_URL: ${{ env.BILLING_SQL_TEST_DATABASE_URL }}
        run: bash SCRIPTS/ci-billing-schema.sh

      - name: Test billing SQL against real Postgres
        run: pnpm jest --runInBand src/lib/billing/billingSqlIntegration.test.ts

      # GET /v1/hermes-mcp/proposals の越境防止(shareConsentSqlPredicate)と、
      # searchConversationsの「発話ゼロセッションがlimitを食い潰さない」挙動は
      # SQLの意味論(jsonb_typeof・DESC時のNULLの既定位置)そのものが検証対象で、
      # モックしたDBでは原理的に再現できない(各テストファイル冒頭のコメント参照)。
      # ★前提: tenants本体はci-billing-schema.shが作成済み。ここではその上に
      # features列とhermes-mcp固有のテーブルだけ追加する(SCRIPTS/ci-hermes-schema.sh参照)。
      - name: Apply hermes-mcp schema migrations
        env:
          DATABASE_URL: ${{ env.HERMES_MCP_SQL_TEST_DATABASE_URL }}
        run: bash SCRIPTS/ci-hermes-schema.sh

      - name: Test hermes-mcp SQL against real Postgres
        run: |
          pnpm jest --runInBand \
            src/api/hermes-mcp/hermesConsentSqlIntegration.test.ts \
            src/api/hermes-mcp/hermesProposalsWriteSqlIntegration.test.ts \
            src/api/hermes-mcp/hermesMcpRepositorySqlIntegration.test.ts

      # getRuleEffect(DiD集計。GET /v1/hermes-mcp/proposalsがHermesへの効果測定に使う)は、
      # before/afterの境界(>=)・tenant_id越境・score=0/NULLの扱い・LIMIT打ち切りなど、
      # モックでは検証できないSQLの意味論そのものが対象のため、実Postgresで確認する。
      # 依存テーブル(tuning_rules/chat_sessions/chat_messages/conversation_evaluations/
      # conversion_attributions)はhermes-mcpスキーマが既に作成済みのため、そのまま使い回す。
      - name: Test analytics SQL against real Postgres
        run: pnpm jest --runInBand src/api/admin/analytics/ruleEffectSqlIntegration.test.ts

      # 書籍チャンク編集の楽観ロック(PUT /v1/admin/knowledge/book-pdf/chunks/:chunkId の
      # CASのUPDATE WHERE句)は、モックDBでは検証できない(WHERE句から版チェック条件を
      # 削除してもモック版のJS判定が生き残るため単体テストは落ちない。実際に確認済み)。
      # faq_embeddings / book_uploads は hermes-mcp スキーマに同居させてある
      # (SCRIPTS/ci-hermes-schema.sh参照)ため、ここでは既に作成済みの前提でよい。
      - name: Test book chunk optimistic lock SQL against real Postgres
        run: pnpm jest --runInBand src/api/admin/knowledge/bookChunkOptimisticLockSqlIntegration.test.ts

  admin-ui-build:
    name: Gate 3 — admin-ui typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (root)
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build

      - name: Install admin-ui
        run: cd admin-ui && pnpm install --frozen-lockfile

      # admin-ui の tsc -b は長らく CI 非実行だった(既存エラー24件のため配線できなかった)。
      # テストより先に置く: 型が壊れているならテストを走らせる前に落としたい。
      - name: Typecheck admin-ui (tsc -b)
        run: cd admin-ui && pnpm typecheck

      # admin-ui の vitest は長らく CI 非実行で、Gate 1(pnpm verify)をローカルで
      # 回した人しか結果を見ていなかった。そのため useAuth.test.tsx のフレークが
      # #662 以降ずっと赤いまま誰にも気づかれなかった(本PRで修正)。
      # ビルドより先に置く: 壊れているなら成果物を作る前に落としたい。
      # 依存は上の Install admin-ui で入っているため追加コストは無い。
      - name: Test admin-ui (vitest)
        run: cd admin-ui && pnpm test:ui

      # Gate 3 は非決定的に落ちることがある(2026-08-30 時点で根本原因は未特定)。
      # 失敗したジョブを再実行するとログが最新の試行で上書きされ、失敗時の
      # エラーと各テストの所要時間が失われる。artifact は試行ごとに残るため、
      # 次に落ちたときの唯一の手がかりになる。
      # if: always() は「成功時も残す」ため。失敗時だけだと比較対象(正常時の
      # duration 分布)が無く、「遅かったのか一瞬で落ちたのか」を判断できない。
      - name: Upload vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ github.run_attempt }}
          path: admin-ui/vitest-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build admin-ui
        run: cd admin-ui && pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
