name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Gate 1 — typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # jest --runInBand が大規模スイートで node 既定ヒープ(~4GB)を超え OOM (FATAL heap limit / exit 134) するため明示拡張。
    # 症状: docs-only PR でも同一の OOM で Gate 1 が落ちる = main 由来の CI 環境問題 (PR 内容と無関係)。
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # SCRIPTS/ の shell テストは jest の testMatch({src,tests}/**/*.test.ts)に入らないため
      # 明示的に走らせる。配線しないと、admin-ui の vitest が #662 以降ずっと赤いまま
      # 誰にも気づかれなかったのと同じ穴になる(CLAUDE.md「テストの最低ライン」)。
      # backup-postgres.test.sh は本物のDB・Slackに触れない(PG_DUMP と NOTIFY を差し替える)。
      - name: Test shell scripts
        run: bash SCRIPTS/backup-postgres.test.sh

  admin-ui-build:
    name: Gate 3 — admin-ui typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (root)
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build

      - name: Install admin-ui
        run: cd admin-ui && pnpm install --frozen-lockfile

      # admin-ui の tsc -b は長らく CI 非実行だった(既存エラー24件のため配線できなかった)。
      # テストより先に置く: 型が壊れているならテストを走らせる前に落としたい。
      - name: Typecheck admin-ui (tsc -b)
        run: cd admin-ui && pnpm typecheck

      # admin-ui の vitest は長らく CI 非実行で、Gate 1(pnpm verify)をローカルで
      # 回した人しか結果を見ていなかった。そのため useAuth.test.tsx のフレークが
      # #662 以降ずっと赤いまま誰にも気づかれなかった(本PRで修正)。
      # ビルドより先に置く: 壊れているなら成果物を作る前に落としたい。
      # 依存は上の Install admin-ui で入っているため追加コストは無い。
      - name: Test admin-ui (vitest)
        run: cd admin-ui && pnpm test:ui

      - name: Build admin-ui
        run: cd admin-ui && pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
