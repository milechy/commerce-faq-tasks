name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Gate 1 — typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # jest --runInBand が大規模スイートで node 既定ヒープ(~4GB)を超え OOM (FATAL heap limit / exit 134) するため明示拡張。
    # 症状: docs-only PR でも同一の OOM で Gate 1 が落ちる = main 由来の CI 環境問題 (PR 内容と無関係)。
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # SCRIPTS/ の shell テストは jest の testMatch({src,tests}/**/*.test.ts)に入らないため
      # 明示的に走らせる。配線しないと、admin-ui の vitest が #662 以降ずっと赤いまま
      # 誰にも気づかれなかったのと同じ穴になる(CLAUDE.md「テストの最低ライン」)。
      # backup-postgres.test.sh は本物のDB・Slackに触れない(PG_DUMP と NOTIFY を差し替える)。
      - name: Test shell scripts
        run: bash SCRIPTS/backup-postgres.test.sh

  billing-sql:
    name: Gate 4 — billing SQL integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 課金集計SQL(computeExpectedBilling)を、正規表現照合や再現実装ではなく
    # 実際にPostgresへ実行して検証する(A-2)。stripeSync.test.ts は集計SQLの
    # 意味論(GROUP BY・NUMERIC の丸め・タイムゾーン境界)を一度も実行しないまま
    # 守っていたため、他のGateとは別ジョブとして独立させた
    # (Gate 1 と並列実行できるようにし、失敗時にどちらが原因か切り分けやすくする)。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BILLING_SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_sql_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ubuntu-latest ランナーに postgresql-client が入っている保証が無いため明示的に導入する。
      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client

      # 課金集計SQLが参照するテーブル(tenants / usage_logs / stripe_subscriptions /
      # stripe_usage_reports)だけを、実際のmigrationファイルを本番へ適用された
      # 順序どおりに流して作る。スコープを絞っている理由は
      # SCRIPTS/ci-billing-schema.sh のコメント参照(全74本超のmigrationを
      # 機械的に適用する仕組みはこのリポジトリに無く、依存順序が
      # ファイル名のアルファベット順とは一致しない箇所があるため)。
      - name: Apply billing schema migrations
        env:
          DATABASE_URL: ${{ env.BILLING_SQL_TEST_DATABASE_URL }}
        run: bash SCRIPTS/ci-billing-schema.sh

      - name: Test billing SQL against real Postgres
        run: pnpm jest --runInBand src/lib/billing/billingSqlIntegration.test.ts

  admin-ui-build:
    name: Gate 3 — admin-ui typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (root)
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build

      - name: Install admin-ui
        run: cd admin-ui && pnpm install --frozen-lockfile

      # admin-ui の tsc -b は長らく CI 非実行だった(既存エラー24件のため配線できなかった)。
      # テストより先に置く: 型が壊れているならテストを走らせる前に落としたい。
      - name: Typecheck admin-ui (tsc -b)
        run: cd admin-ui && pnpm typecheck

      # admin-ui の vitest は長らく CI 非実行で、Gate 1(pnpm verify)をローカルで
      # 回した人しか結果を見ていなかった。そのため useAuth.test.tsx のフレークが
      # #662 以降ずっと赤いまま誰にも気づかれなかった(本PRで修正)。
      # ビルドより先に置く: 壊れているなら成果物を作る前に落としたい。
      # 依存は上の Install admin-ui で入っているため追加コストは無い。
      - name: Test admin-ui (vitest)
        run: cd admin-ui && pnpm test:ui

      - name: Build admin-ui
        run: cd admin-ui && pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
